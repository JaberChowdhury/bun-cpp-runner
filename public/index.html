<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>C++ Pro Workspace</title>

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>

        <style>
            :root {
                --bg-main: #0d0d12;
                --bg-surface: #181820;
                --bg-input: #22222b;
                --bg-hover: #2d2d38;
                --text-main: #e2e2e9;
                --text-muted: #8b8b9a;
                --accent: #5c6fff;
                --accent-hover: #4858db;
                --border: #31313e;
                --success: #10b981;
                --error: #ef4444;
                --warning: #f59e0b;
                --info: #06b6d4;
                --font-mono: "Fira Code", "Consolas", monospace;
                --font-sans: system-ui, -apple-system, sans-serif;
            }

            body {
                font-family: var(--font-sans);
                background: var(--bg-main);
                color: var(--text-main);
                margin: 0;
                padding: 2rem;
                display: flex;
                justify-content: center;
                height: 100vh;
                box-sizing: border-box;
            }
            .workspace {
                width: 100%;
                max-width: 1500px;
                display: grid;
                grid-template-columns: 1.3fr 1fr;
                gap: 1.5rem;
                height: 100%;
            }
            .panel {
                background: var(--bg-surface);
                border-radius: 12px;
                border: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                overflow: hidden;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            }
            .panel-header {
                padding: 1rem 1.5rem;
                font-size: 1rem;
                font-weight: 600;
                background: rgba(0, 0, 0, 0.2);
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .panel-body {
                padding: 1.5rem;
                display: flex;
                flex-direction: column;
                gap: 1rem;
                flex-grow: 1;
                overflow-y: auto;
            }

            /* CodeMirror Overrides */
            .CodeMirror {
                height: 100% !important;
                border-radius: 6px;
                border: 1px solid var(--border);
                font-family: var(--font-mono);
                font-size: 15px;
            }

            /* Toolbars & Controls */
            .editor-toolbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: var(--bg-input);
                padding: 0.75rem 1rem;
                border-radius: 6px;
                border: 1px solid var(--border);
                margin-bottom: 1rem;
            }
            select,
            .flag-check {
                background: var(--bg-main);
                color: var(--text-main);
                border: 1px solid var(--border);
                padding: 0.5rem;
                border-radius: 4px;
                font-size: 0.85rem;
                outline: none;
            }
            .flag-group {
                display: flex;
                gap: 1rem;
                align-items: center;
                font-size: 0.85rem;
                font-weight: bold;
                color: var(--text-muted);
            }

            .tabs {
                display: flex;
                background: rgba(0, 0, 0, 0.2);
                border-bottom: 1px solid var(--border);
            }
            .tab {
                padding: 1rem 1.5rem;
                cursor: pointer;
                color: var(--text-muted);
                font-weight: 600;
                font-size: 0.9rem;
                transition: 0.2s;
                border-bottom: 2px solid transparent;
            }
            .tab:hover {
                color: var(--text-main);
                background: var(--bg-hover);
            }
            .tab.active {
                color: var(--accent);
                border-bottom: 2px solid var(--accent);
            }
            .tab-content {
                display: none;
                height: 100%;
            }
            .tab-content.active {
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }

            label {
                font-size: 0.85rem;
                color: var(--text-muted);
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            textarea {
                width: 100%;
                background: var(--bg-input);
                color: var(--text-main);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 1rem;
                font-family: var(--font-mono);
                font-size: 0.95rem;
                resize: vertical;
                box-sizing: border-box;
                outline: none;
            }
            textarea:focus {
                border-color: var(--accent);
            }

            .toggle-group {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                background: var(--bg-input);
                padding: 0.75rem 1rem;
                border-radius: 6px;
                border: 1px solid var(--border);
                cursor: pointer;
                user-select: none;
            }
            input[type="checkbox"] {
                accent-color: var(--accent);
                cursor: pointer;
            }

            button {
                background: var(--accent);
                color: white;
                border: none;
                padding: 1rem;
                border-radius: 6px;
                cursor: pointer;
                font-size: 1rem;
                font-weight: 600;
                transition: 0.2s;
            }
            button:hover:not(:disabled) {
                background: var(--accent-hover);
            }
            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            pre {
                background: #000;
                padding: 1rem;
                border-radius: 6px;
                overflow-x: auto;
                color: #a6accd;
                font-family: var(--font-mono);
                border: 1px solid var(--border);
                margin: 0;
                font-size: 0.9rem;
                white-space: pre-wrap;
                word-wrap: break-word;
            }
            .badge {
                padding: 0.25rem 0.75rem;
                border-radius: 4px;
                font-weight: 600;
                font-size: 0.8rem;
                text-transform: uppercase;
            }
            .badge.success {
                background: rgba(16, 185, 129, 0.15);
                color: var(--success);
                border: 1px solid rgba(16, 185, 129, 0.3);
            }
            .badge.error {
                background: rgba(239, 68, 68, 0.15);
                color: var(--error);
                border: 1px solid rgba(239, 68, 68, 0.3);
            }

            .time-stats {
                font-size: 0.85rem;
                color: var(--text-muted);
                display: flex;
                gap: 1rem;
                align-items: center;
            }
            .time-stats span.val {
                color: var(--text-main);
                font-weight: 600;
            }

            .history-list {
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
                overflow-y: auto;
            }
            .history-item {
                background: var(--bg-input);
                border: 1px solid var(--border);
                padding: 1rem;
                border-radius: 6px;
                cursor: pointer;
                transition: 0.2s;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .history-item:hover {
                border-color: var(--accent);
            }

            .log-controls {
                display: flex;
                gap: 0.5rem;
                margin-bottom: 0.5rem;
            }
            .log-btn {
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
                border-radius: 4px;
                background: var(--bg-input);
                border: 1px solid var(--border);
                color: var(--text-muted);
                cursor: pointer;
                font-weight: bold;
            }
            .log-btn.active {
                background: var(--accent);
                color: white;
                border-color: var(--accent);
            }
            .log-viewer {
                height: 100%;
                overflow-y: auto;
                background: #000;
                padding: 1rem;
                border-radius: 6px;
                font-family: var(--font-mono);
                font-size: 0.85rem;
                color: #a6accd;
                border: 1px solid var(--border);
                line-height: 1.5;
                white-space: pre-wrap;
            }

            .c-info {
                color: var(--accent);
            }
            .c-compile {
                color: var(--warning);
            }
            .c-exec {
                color: var(--info);
            }
            .c-succ {
                color: var(--success);
            }
            .c-err {
                color: var(--error);
            }
            .c-post {
                color: #d946ef;
            }
            .c-get {
                color: var(--success);
            }

            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }
            ::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 4px;
            }
        </style>
    </head>
    <body>
        <div class="workspace">
            <div class="panel">
                <div class="panel-header">
                    <span>📝 CodeMirror IDE</span>
                    <span style="font-size: 0.8rem; color: var(--text-muted)"
                        >Shortcut: Ctrl + Enter</span
                    >
                </div>

                <div class="panel-body" style="padding-bottom: 0">
                    <div class="editor-toolbar">
                        <select id="snippetSelector" onchange="loadSnippet()">
                            <option value="basic">Standard Template</option>
                            <option value="blank">Blank File</option>
                            <option value="graph">Graph DFS Template</option>
                        </select>
                        <div class="flag-group">
                            <label
                                ><input
                                    type="checkbox"
                                    class="cpp-flag"
                                    value="-O3"
                                />
                                -O3 (Optimize)</label
                            >
                            <label
                                ><input
                                    type="checkbox"
                                    class="cpp-flag"
                                    value="-Wall"
                                    checked
                                />
                                -Wall</label
                            >
                            <label
                                ><input
                                    type="checkbox"
                                    class="cpp-flag"
                                    value="-std=c++20"
                                    checked
                                />
                                C++20</label
                            >
                        </div>
                    </div>

                    <div style="flex-grow: 1; min-height: 0">
                        <textarea id="codeEditor"></textarea>
                    </div>
                </div>
                <div class="panel-body" style="flex-grow: 0; padding-top: 1rem">
                    <button id="runBtn" onclick="runCode()">
                        ⚡ Compile & Run Code
                    </button>
                </div>
            </div>

            <div class="panel">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('tab-io')">
                        I/O & Results
                    </div>
                    <div
                        class="tab"
                        onclick="
                            switchTab('tab-history');
                            loadHistory();
                        "
                    >
                        🕒 History
                    </div>
                    <div
                        class="tab"
                        onclick="
                            switchTab('tab-logs');
                            loadLogs('runner');
                        "
                    >
                        📜 Server Logs
                    </div>
                </div>

                <div class="panel-body">
                    <div id="tab-io" class="tab-content active">
                        <label>Standard Input</label>
                        <textarea id="input" rows="4" spellcheck="false">
3
1 2
10 20
-5 5</textarea
                        >

                        <label class="toggle-group" for="validateToggle">
                            <input type="checkbox" id="validateToggle" />
                            <span style="font-size: 0.9rem; font-weight: bold"
                                >Enable Expected Output Validation</span
                            >
                        </label>

                        <div
                            id="expectedOutputWrapper"
                            style="
                                display: none;
                                flex-direction: column;
                                gap: 0.5rem;
                            "
                        >
                            <label>Expected Output</label>
                            <textarea
                                id="expectedOutput"
                                rows="3"
                                spellcheck="false"
                            >
3
30
0</textarea
                            >
                        </div>

                        <div
                            id="results"
                            style="
                                display: none;
                                flex-direction: column;
                                gap: 1rem;
                                margin-top: 1rem;
                                padding-top: 1rem;
                                border-top: 1px solid var(--border);
                            "
                        >
                            <div
                                style="
                                    display: flex;
                                    justify-content: space-between;
                                    align-items: center;
                                "
                            >
                                <span id="verdictBadge" class="badge"></span>
                                <div class="time-stats">
                                    <span
                                        >🔨 Compile:
                                        <span id="compileTimeTaken" class="val"
                                            >0</span
                                        >ms</span
                                    >
                                    <span
                                        >⚡ Exec:
                                        <span id="timeTaken" class="val">0</span
                                        >ms</span
                                    >
                                </div>
                            </div>
                            <div
                                id="resultBody"
                                style="
                                    display: flex;
                                    flex-direction: column;
                                    gap: 1rem;
                                "
                            ></div>
                        </div>
                    </div>

                    <div id="tab-history" class="tab-content">
                        <div
                            style="
                                font-size: 0.85rem;
                                color: var(--text-muted);
                                margin-bottom: 0.5rem;
                            "
                        >
                            Click any past run to restore its state.
                        </div>
                        <div id="historyList" class="history-list"></div>
                    </div>

                    <div id="tab-logs" class="tab-content">
                        <div class="log-controls">
                            <button
                                id="btnLogRunner"
                                class="log-btn active"
                                onclick="loadLogs('runner')"
                            >
                                ⚙️ Runner Logs
                            </button>
                            <button
                                id="btnLogApi"
                                class="log-btn"
                                onclick="loadLogs('api')"
                            >
                                🌐 API Hits
                            </button>
                            <button
                                class="log-btn"
                                onclick="loadLogs(currentLogType)"
                                style="margin-left: auto"
                            >
                                🔄 Refresh
                            </button>
                        </div>
                        <div id="logViewer" class="log-viewer">
                            Loading logs...
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // --- 1. INITIALIZE CODEMIRROR ---
            const editor = CodeMirror.fromTextArea(
                document.getElementById("codeEditor"),
                {
                    mode: "text/x-c++src",
                    theme: "dracula",
                    lineNumbers: true,
                    autoCloseBrackets: true,
                    indentUnit: 4,
                    matchBrackets: true,
                },
            );

            const snippets = {
                blank: "",
                basic: `#include <iostream>\nusing namespace std;\n\nint main() {\n    ios_base::sync_with_stdio(false);\n    cin.tie(NULL);\n    \n    int t;\n    cin >> t;\n    while(t--) {\n        // Your code here\n        \n    }\n    return 0;\n}`,
                graph: `#include <iostream>\n#include <vector>\nusing namespace std;\n\nconst int MAXN = 1e5 + 5;\nvector<int> adj[MAXN];\nbool visited[MAXN];\n\nvoid dfs(int v) {\n    visited[v] = true;\n    for(int u : adj[v]) {\n        if(!visited[u]) dfs(u);\n    }\n}\n\nint main() {\n    int n, m;\n    cin >> n >> m;\n    for(int i = 0; i < m; i++) {\n        int u, v;\n        cin >> u >> v;\n        adj[u].push_back(v);\n        adj[v].push_back(u);\n    }\n    return 0;\n}`,
            };

            function loadSnippet() {
                const val = document.getElementById("snippetSelector").value;
                editor.setValue(snippets[val]);
            }
            // Load default snippet on start
            editor.setValue(snippets.basic);

            // --- 2. KEYBOARD SHORTCUT (Ctrl/Cmd + Enter) ---
            document.addEventListener("keydown", function (e) {
                if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                    e.preventDefault();
                    runCode();
                }
            });

            // --- 3. CORE LOGIC ---
            let currentHistory = [];
            let currentLogType = "runner";

            function switchTab(tabId) {
                document
                    .querySelectorAll(".tab")
                    .forEach((t) => t.classList.remove("active"));
                document
                    .querySelectorAll(".tab-content")
                    .forEach((c) => c.classList.remove("active"));
                event.currentTarget.classList.add("active");
                document.getElementById(tabId).classList.add("active");
            }

            document
                .getElementById("validateToggle")
                .addEventListener("change", function () {
                    document.getElementById(
                        "expectedOutputWrapper",
                    ).style.display = this.checked ? "flex" : "none";
                });

            async function runCode() {
                const btn = document.getElementById("runBtn");
                const resultsDiv = document.getElementById("results");
                const resultBody = document.getElementById("resultBody");
                const verdictBadge = document.getElementById("verdictBadge");

                // Grab active compiler flags
                const flags = Array.from(
                    document.querySelectorAll(".cpp-flag:checked"),
                ).map((cb) => cb.value);

                const payload = {
                    code: editor.getValue(), // Extract from CodeMirror
                    input: document.getElementById("input").value,
                    validateOutput:
                        document.getElementById("validateToggle").checked,
                    expectedOutput:
                        document.getElementById("expectedOutput").value,
                    compilerFlags: flags, // Send flags to server
                };

                btn.disabled = true;
                btn.innerText = "⏳ Executing...";
                resultsDiv.style.display = "none";

                try {
                    const response = await fetch("/execute", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload),
                    });
                    const data = await response.json();

                    document
                        .querySelector("[onclick=\"switchTab('tab-io')\"]")
                        .click();
                    resultsDiv.style.display = "flex";

                    document.getElementById("compileTimeTaken").innerText =
                        data.compileTime || "N/A";
                    document.getElementById("timeTaken").innerText =
                        data.time || "N/A";

                    const isSuccess =
                        data.status === "success" &&
                        (!payload.validateOutput || data.match);
                    verdictBadge.className =
                        "badge " + (isSuccess ? "success" : "error");
                    verdictBadge.innerText = data.type;

                    if (data.status === "error") {
                        resultBody.innerHTML = `<div><label>Error Details</label><pre style="color: #ef4444">${data.message}</pre></div>`;
                    } else {
                        let html = `<div><label>Standard Output</label><pre>${data.output || "No output"}</pre></div>`;
                        if (payload.validateOutput && !data.match)
                            html += `<div><label>Expected Output</label><pre>${payload.expectedOutput.trim()}</pre></div>`;
                        resultBody.innerHTML = html;
                    }
                } catch (error) {
                    alert("Server disconnected!");
                } finally {
                    btn.disabled = false;
                    btn.innerText = "⚡ Compile & Run Code";
                }
            }

            async function loadHistory() {
                const container = document.getElementById("historyList");
                try {
                    const res = await fetch("/api/history");
                    currentHistory = await res.json();
                    if (currentHistory.length === 0)
                        return (container.innerHTML =
                            '<div style="color: var(--text-muted)">No history available.</div>');

                    container.innerHTML = currentHistory
                        .map((item, index) => {
                            const isSuccess =
                                item.status === "success" &&
                                (!item.validateOutput || item.match);
                            const badgeClass = isSuccess ? "success" : "error";
                            return `<div class="history-item" onclick="restoreHistory(${index})">
                    <div style="display: flex; flex-direction: column; gap: 0.35rem;">
                        <span style="font-weight: bold; color: var(--${badgeClass}); font-size: 0.9rem;">${item.type}</span>
                        <span style="font-size: 0.8rem; color: var(--text-muted);">${item.date} • 🔨 ${item.compileTime}ms • ⚡ ${item.time}ms</span>
                    </div>
                    <span class="badge ${badgeClass}">Restore</span>
                </div>`;
                        })
                        .join("");
                } catch (e) {
                    container.innerHTML =
                        '<div style="color: #ef4444">Failed to load history.</div>';
                }
            }

            function restoreHistory(index) {
                const item = currentHistory[index];
                if (!item) return;

                editor.setValue(item.code || ""); // Restore to CodeMirror

                document.getElementById("input").value = item.input || "";
                const toggle = document.getElementById("validateToggle");
                toggle.checked = item.validateOutput || false;
                toggle.dispatchEvent(new Event("change"));
                document.getElementById("expectedOutput").value =
                    item.expectedOutput || "";
                document
                    .querySelector("[onclick=\"switchTab('tab-io')\"]")
                    .click();
            }

            function formatLogText(text) {
                return text
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/\[INFO\]/g, '<span class="c-info">[INFO]</span>')
                    .replace(
                        /\[COMPILE\]/g,
                        '<span class="c-compile">[COMPILE]</span>',
                    )
                    .replace(
                        /\[EXECUTE\]/g,
                        '<span class="c-exec">[EXECUTE]</span>',
                    )
                    .replace(
                        /\[SUCCESS\]/g,
                        '<span class="c-succ">[SUCCESS]</span>',
                    )
                    .replace(/\[ERROR\]/g, '<span class="c-err">[ERROR]</span>')
                    .replace(/\[POST\]/g, '<span class="c-post">[POST]</span>')
                    .replace(/\[GET\]/g, '<span class="c-get">[GET]</span>')
                    .replace(/\[API\]/g, '<span class="c-info">[API]</span>');
            }

            async function loadLogs(type) {
                currentLogType = type;
                document
                    .getElementById("btnLogRunner")
                    .classList.toggle("active", type === "runner");
                document
                    .getElementById("btnLogApi")
                    .classList.toggle("active", type === "api");

                const viewer = document.getElementById("logViewer");
                viewer.innerHTML =
                    '<span style="color: var(--text-muted)">Loading...</span>';

                try {
                    const res = await fetch(`/api/logs/${type}`);
                    const text = await res.text();
                    viewer.innerHTML = formatLogText(text);
                    viewer.scrollTop = viewer.scrollHeight;
                } catch (e) {
                    viewer.innerText = "Failed to load logs.";
                }
            }
        </script>
    </body>
</html>
